<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Politike privatnosti – NMS Solutions</title>
<meta name="description" content="Politike privatnosti aplikacija za zakazivanje koje objavljuje NMS Solutions.">
<meta name="color-scheme" content="light dark">
<style>
  :root { --bg: #faf6f1; --card: #ffffff; --text: #2b1d14; --muted: #6b5546; --accent: #6f4a2f; --line: #e6d9cc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1512; --card: #261d18; --text: #f1e8df; --muted: #c3b2a4; --accent: #d9b48f; --line: #3d2f27; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 48px; background: var(--bg); color: var(--text);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 { margin: 0 0 8px; font-size: 2rem; line-height: 1.2; color: var(--accent); }
  p { margin: 0 0 16px; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { margin: 0 0 12px; }
  a.card {
    display: block; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    color: var(--text); text-decoration: none;
  }
  a.card strong { display: block; color: var(--accent); font-size: 1.1rem; }
  a.card span { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Politike privatnosti</h1>
  <p>Aplikacije za zakazivanje koje objavljuje NMS Solutions, Beograd. Svaka aplikacija ima svoju politiku:</p>
  <ul>
    <li>
      <a class="card" href="salon-igor/">
        <strong>Salon Igor</strong>
        <span>Frizerski salon Igor, Beograd · Android i iPhone</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
